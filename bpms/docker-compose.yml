version: '3.8'

services:
  # FastAPI Application
  app:
    build: .
    container_name: bpms
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bpmsdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - app_network

  # PostgreSQL Database
  db:
    image: postgres:13
    container_name: bpms_repo
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bpmsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network

  # Redis for rate limiting
  redis:
    image: redis:latest
    container_name: bpms_redis
    ports:
      - "6379:6379"
    networks:
      - app_network

# Shared Network (for secure container communication)
networks:
  app_network:
    driver: bridge

# Persistent volume for PostgreSQL data
volumes:
  postgres_data: